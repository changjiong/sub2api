name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'changjiong/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git 2>/dev/null \
            || git remote set-url upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        if: steps.merge.outputs.changed == 'true'
        working-directory: backend
        run: |
          make test-unit
          make test-integration

      - name: Run golangci-lint
        if: steps.merge.outputs.changed == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

      - name: Set up pnpm
        if: steps.merge.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.merge.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        if: steps.merge.outputs.changed == 'true'
        run: make test-frontend

      - name: Update fork main
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.UPSTREAM_SYNC_DEPLOY_KEY }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/sub2api-sync-key"
          known_hosts_file="${RUNNER_TEMP}/sub2api-known-hosts"
          umask 077
          printf '%s\n' "${SYNC_DEPLOY_KEY}" > "${key_file}"
          curl --fail --silent --show-error --retry 3 https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "${known_hosts_file}"
          test -s "${key_file}"
          test -s "${known_hosts_file}"

          git commit \
            -m "chore: sync Wei-Shaw/sub2api main" \
            -m "Upstream: ${UPSTREAM_SHA}"
          GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o UserKnownHostsFile=${known_hosts_file}" \
            git push git@github.com:changjiong/sub2api.git HEAD:main
